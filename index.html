<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Work Logger</title>

<style>
body { font-family: system-ui; background:#f4f6fb; padding:20px; }
.panel { background:white; padding:16px; border-radius:12px; margin-bottom:16px; }

button {
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button.stop { background:#dc2626; }

input { width:60px; }
#timer { font-size:28px; font-weight:bold; }
</style>
</head>

<body>

<!-- ======================
     POMODORO PANEL
====================== -->
<div class="panel">
  <h2>Pomodoro</h2>

  Work <input id="work" value="25">
  Break <input id="short" value="5">
  Long <input id="long" value="15">
  Sessions <input id="sessions" value="4">

  <br><br>

  <label><input type="checkbox" id="auto" checked> Auto cycle</label>

  <br><br>

  <button id="startPom">Start</button>
  <button id="stopPom" class="stop">Stop</button>

  <h3 id="timer">25:00</h3>
  <div id="pomStatus">Idle</div>
</div>

<!-- ======================
     TASK PANEL
====================== -->
<div class="panel">
  <h2>Task Logger</h2>

  <textarea id="desc" placeholder="Task description"></textarea><br><br>

  <button id="startTask">Start Task</button>
  <button id="stopTask">Stop Task</button>
  <button id="export">Export CSV</button>

  <table id="table" border="1" style="width:100%;margin-top:10px;">
    <thead>
      <tr>
        <th>No</th><th>Task</th><th>Start</th><th>End</th><th>Duration</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
/* ---------------------
   GLOBAL STATES
---------------------- */
let tasks = [];
let current = null;

/* ---------------------
   SOUND
---------------------- */
function beep(){
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.frequency.value = 880;
  osc.connect(ctx.destination);
  osc.start();
  setTimeout(()=>osc.stop(),300);
}

/* ---------------------
   TIME HELPERS
---------------------- */
function now(){ return new Date(); }
function fmt(t){ return t? t.toLocaleTimeString() : ""; }

function dur(a,b){
  if(!a) return "";
  const ms=(b?b:new Date())-a;
  const s=Math.floor(ms/1000);
  return `${Math.floor(s/3600)}:${Math.floor(s%3600/60)}:${s%60}`;
}

/* ---------------------
   TABLE RENDER
---------------------- */
function render(){
  const tb=document.querySelector("tbody");
  tb.innerHTML="";
  [...tasks].reverse().forEach((t,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${tasks.length-i}</td>
      <td>${t.desc}</td>
      <td>${fmt(t.start)}</td>
      <td>${fmt(t.end)}</td>
      <td>${dur(t.start,t.end)}</td>`;
