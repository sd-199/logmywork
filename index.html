<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Task Logger</title>

<style>
body {
  font-family: Arial;
  background: #f4f6fb;
  padding: 20px;
}

.panel {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

button {
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

button.stop { background: red; }

input, textarea {
  padding: 5px;
  margin: 5px;
}

#timer {
  font-size: 28px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="panel">
  <h2>Pomodoro</h2>

  Work <input id="work" value="25">
  Break <input id="short" value="5">
  Long <input id="long" value="15">
  Sessions <input id="sessions" value="4">

  <br>

  <label>
    <input type="checkbox" id="auto" checked>
    Auto cycle
  </label>

  <br><br>

  <button id="startPom">Start Pomodoro</button>
  <button id="stopPom" class="stop">Stop</button>

  <div id="timer">25:00</div>
  <div id="status">Idle</div>
</div>

<div class="panel">
  <h2>Task Logger</h2>

  <textarea id="desc" placeholder="Enter task..."></textarea><br>

  <button id="startTask">Start Task</button>
  <button id="stopTask">Stop Task</button>

  <table border="1" width="100%">
    <thead>
      <tr>
        <th>Task</th>
        <th>Start</th>
        <th>End</th>
        <th>Duration</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

<script>
/* =====================
   ELEMENTS
===================== */
const startTaskBtn = document.getElementById("startTask");
const stopTaskBtn = document.getElementById("stopTask");
const desc = document.getElementById("desc");

const startPomBtn = document.getElementById("startPom");
const stopPomBtn = document.getElementById("stopPom");

const timerEl = document.getElementById("timer");
const statusEl = document.getElementById("status");
const tableEl = document.getElementById("table");

const workEl = document.getElementById("work");
const shortEl = document.getElementById("short");
const longEl = document.getElementById("long");
const sessionsEl = document.getElementById("sessions");
const autoEl = document.getElementById("auto");

/* =====================
   STATE
===================== */
let tasks = [];
let currentTask = null;

let timer = null;
let timeLeft = 0;
let mode = "work";
let session = 0;

/* =====================
   SOUND
===================== */
function beep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.frequency.value = 880;
  osc.connect(ctx.destination);
  osc.start();
  setTimeout(() => osc.stop(), 300);
}

/* =====================
   TIMER DISPLAY
===================== */
function updateTimer() {
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  timerEl.textContent =
    String(m).padStart(2, '0') + ":" +
    String(s).padStart(2, '0');
}

/* =====================
   TIMER ENGINE
===================== */
function startTimer(seconds) {
  clearInterval(timer);
  timeLeft = Number(seconds);
  updateTimer();

  timer = setInterval(() => {
    timeLeft--;
    updateTimer();

    if (timeLeft <= 0) {
      clearInterval(timer);
      nextPhase();
    }
  }, 1000);
}

function nextPhase() {
  beep();

  const work = Number(workEl.value) * 60;
  const short = Number(shortEl.value) * 60;
  const long = Number(longEl.value) * 60;
  const max = Number(sessionsEl.value);

  if (mode === "work") {
    session++;

    if (session % max === 0) {
      mode = "long";
      statusEl.textContent = "Long break";
      autoRun(long);
    } else {
      mode = "break";
      statusEl.textContent = "Short break";
      autoRun(short);
    }
  } else {
    mode = "work";
    statusEl.textContent = "Work";
    autoRun(work);
  }
}

function autoRun(sec) {
  if (autoEl.checked) {
    startTimer(sec);
  }
}

/* =====================
   TASK LOGIC
===================== */
function renderTasks() {
  tableEl.innerHTML = "";

  tasks.slice().reverse().forEach(t => {
    const tr = document.createElement("tr");

    const duration = t.end
      ? Math.floor((t.end - t.start) / 1000)
      : Math.floor((new Date() - t.start) / 1000);

    tr.innerHTML = `
      <td>${t.desc}</td>
      <td>${t.start.toLocaleTimeString()}</td>
      <td>${t.end ? t.end.toLocaleTimeString() : ""}</td>
      <td>${duration}s</td>`;

    tableEl.appendChild(tr);
  });
}

/* =====================
   BUTTON EVENTS
===================== */
startTaskBtn.onclick = () => {

  const text = desc.value.trim();

  if (!text) {
    alert("Enter a task!");
    return;
  }

  currentTask = {
    desc: text,
    start: new Date(),
    end: null
  };

  tasks.push(currentTask);
  renderTasks();

  // 🔥 Start Pomodoro automatically
  session = 0;
  mode = "work";
  statusEl.textContent = "Work";

  startTimer(Number(workEl.value) * 60);

  desc.value = "";
};

stopTaskBtn.onclick = () => {
  if (!currentTask) return;

  currentTask.end = new Date();
  currentTask = null;

  renderTasks();

  clearInterval(timer);
  statusEl.textContent = "Stopped";
};

startPomBtn.onclick = () => {
  session = 0;
  mode = "work";
  statusEl.textContent = "Work";
  startTimer(Number(workEl.value) * 60);
};

stopPomBtn.onclick = () => {
  clearInterval(timer);
  statusEl.textContent = "Stopped";
};

/* =====================
   INIT
===================== */
updateTimer();
</script>

</body>
</html>
