<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pomodoro Logger</title>

<style>
:root {
  --accent: #2563eb;
  --danger: #dc2626;
  --success: #16a34a;
}

body {
  font-family: system-ui;
  background: #f4f6fb;
  padding: 20px;
}

.panel {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.05);
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: var(--accent);
  color: white;
  font-weight: 600;
}

button.secondary { background: #111; }
button.stop { background: var(--danger); }

input, select {
  padding: 6px;
  border-radius: 6px;
}

.row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

#timerDisplay {
  font-size: 32px;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="panel">
  <h2>Pomodoro Controls</h2>

  <div class="row">
    Work: <input id="workMin" type="number" value="25" min="1"> min
    Break: <input id="breakMin" type="number" value="5" min="1"> min
    Long: <input id="longMin" type="number" value="15" min="1"> min
    Sessions: <input id="sessions" type="number" value="4" min="1">
  </div>

  <div class="row">
    <label><input type="checkbox" id="autoStart" checked> Auto cycle</label>
  </div>

  <div class="row">
    <button id="startPom">Start</button>
    <button id="stopPom" class="stop">Stop</button>
  </div>

  <div id="timerDisplay">25:00</div>
  <div id="status">Idle</div>
</div>

<div class="panel">
  <h2>Task Logger</h2>
  <textarea id="desc" placeholder="Task description"></textarea><br><br>
  <button id="startTask">Start Task</button>
  <button id="stopTask">Stop Task</button>
</div>

<script>
/* ---------------------
   SIMPLE SOUND (RELIABLE)
---------------------- */
function beep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.value = 880;
  osc.connect(ctx.destination);
  osc.start();
  setTimeout(()=>osc.stop(),300);
}

/* ---------------------
   POMODORO ENGINE
---------------------- */
let timer = null;
let timeLeft = 0;
let mode = "work";
let sessionCount = 0;

const display = document.getElementById("timerDisplay");
const statusEl = document.getElementById("status");

function updateDisplay() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2,'0');
  const s = String(timeLeft % 60).padStart(2,'0');
  display.textContent = `${m}:${s}`;
}

function startTimer(seconds) {
  clearInterval(timer);
  timeLeft = seconds;
  updateDisplay();

  timer = setInterval(() => {
    timeLeft--;
    updateDisplay();

    if (timeLeft <= 0) {
      clearInterval(timer);
      onComplete();
    }
  }, 1000);
}

function onComplete() {
  beep();

  if (Notification.permission === "granted") {
    new Notification("Pomodoro done!");
  }

  const workMin = +workMinEl.value * 60;
  const breakMin = +breakMinEl.value * 60;
  const longMin = +longMinEl.value * 60;
  const maxSessions = +sessionsEl.value;

  if (mode === "work") {
    sessionCount++;

    if (sessionCount % maxSessions === 0) {
      mode = "long";
      statusEl.textContent = "Long break";
      autoNext(longMin);
    } else {
      mode = "break";
      statusEl.textContent = "Short break";
      autoNext(breakMin);
    }
  } else {
    mode = "work";
    statusEl.textContent = "Work";
    autoNext(workMin);
  }
}

function autoNext(duration) {
  if (autoStart.checked) {
    startTimer(duration);
  }
}

/* ---------------------
   CONTROLS
---------------------- */
const workMinEl = document.getElementById("workMin");
const breakMinEl = document.getElementById("breakMin");
const longMinEl = document.getElementById("longMin");
const sessionsEl = document.getElementById("sessions");
const autoStart = document.getElementById("autoStart");

document.getElementById("startPom").onclick = () => {
  mode = "work";
  sessionCount = 0;
  statusEl.textContent = "Work";
  startTimer(workMinEl.value * 60);
};

document.getElementById("stopPom").onclick = () => {
  clearInterval(timer);
  statusEl.textContent = "Stopped";
};

/* ---------------------
   TASK LOGGER (simple)
---------------------- */
let currentTask = null;

document.getElementById("startTask").onclick = () => {
  currentTask = {
    desc: desc.value,
    start: new Date()
  };
  console.log("Task started", currentTask);
};

document.getElementById("stopTask").onclick = () => {
  if (!currentTask) return;
  currentTask.end = new Date();
  console.log("Task finished", currentTask);
};

/* ---------------------
   NOTIFICATION PERMISSION
---------------------- */
if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}
</script>

</body>
</html>
